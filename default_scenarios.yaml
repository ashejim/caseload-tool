# Starter actions for a new install. These are SAMPLES — edit them to make
# them yours, or delete the ones you don't need. Each one files a Salesforce
# note (what the caseload is all about); some also send an email or a text.
# Batch samples ship with preview ON, so nothing sends until you review it.
scenarios:

  # WALKTHROUGH — a totally safe first fire. "Edit at fire time" is ON, so a
  # pre-filled, EDITABLE note pop-up appears first (you see the note-type/course
  # controls), then it opens the note form in Salesforce with submit OFF — so the
  # browser comes forward and leaves it filled for you to review and Submit
  # yourself. Nothing sends, and nothing files until you click Submit. The
  # interactive walkthrough (❔ Help) points here; edit or delete it once comfy.
  Try me - file a test note:
    hotkey: ''
    close_tab_after: false
    find_first: false
    panel_action: true
    notes:
    - interaction_format: Single Interaction
      interaction_type: Admin Note
      body: Test note from the Caseload Notes walkthrough - safe to submit or cancel.
      academic_activities: []
      submit: false
      append_clipboard: false
      enter_additional_text: true

  # WALKTHROUGH (BATCH) — the batch tour points here. Emails a welcome to every
  # student matching its filters and files a note for each. It ships filtered to
  # students with NO ACI contact yet (Last Assigned CI Contact is empty); the
  # tour has you ADD a "Course Code is <your course>" filter so it targets one
  # course. Preview is ON — you review the recipient list AND each email before
  # anything sends. {{preferred_name}} and {{course_code}} fill per student.
  Try me - welcome email (batch):
    hotkey: ''
    close_tab_after: false
    find_first: false
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Sent a welcome email to the newly assigned student.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Welcome to {{course_code}}, {{preferred_name}}!
      body_html_file: walkthrough_welcome.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false
    batch:
      filters:
      - column: Last Assigned CI Contact
        op: is empty
        value: ''
      preview: true

  # SINGLE-FIRE: press F3 with a student's note panel open in Salesforce to
  # fill a note. It uses the "Student note" TEMPLATE below (note_template) — a
  # fill-in form you tab through at fire time; the result becomes the note body.
  # submit is OFF, so it fills the form for you to review and submit — a safe way
  # to try it (Salesforce notes can't be deleted). To type a plain note instead,
  # clear "Default template" on this note in the editor.
  Sample - quick note:
    hotkey: F3
    close_tab_after: false
    find_first: false
    panel_action: true
    notes:
    - interaction_format: Single Interaction
      interaction_type: Admin Note
      body: Reached out to the student about their progress.
      academic_activities: []
      submit: false
      append_clipboard: false
      enter_additional_text: false
      note_template: Student note

  # CASELOAD-PANEL: pick a student in the viewer, then fire this to send a
  # follow-up email AND log a note in one step.
  Sample - follow-up email:
    hotkey: ''
    close_tab_after: false
    find_first: false
    panel_action: true
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Sent a follow-up email to the student.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Following up, {{first_name}}
      body_html_file: sample_followup.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false

  # BATCH (note + email + text): emails AND texts every student the filter
  # matches, and logs a note for each. Edit YOUR_COURSE to your course code.
  # Preview is ON — you review the recipient list before anything sends.
  Sample - welcome (batch):
    hotkey: ''
    close_tab_after: false
    find_first: false
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Sent a welcome email and text to the newly assigned student.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Welcome to {{course_code}}, {{first_name}}!
      body_html_file: sample_welcome.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false
    text:
      body: Hi {{first_name}}! This is {{user_name}}, your {{course_code}} instructor.
        Welcome aboard — reply any time if you have questions.
      body_file: ''
      schedule: true
      window_start_hour: 10
      window_end_hour: 16
      inbox_label: ''
      commit: false
    batch:
      filters:
      - column: Course Code
        op: is
        value: YOUR_COURSE
      - column: Last Assigned CI Contact
        op: is empty
        value: ''
      preview: true

  # BATCH (note + email, no text): congratulate students who passed Task 1.
  # Edit YOUR_COURSE and the filter to match how your course marks Task 1.
  # Preview is ON.
  Sample - Task 1 passed (batch):
    hotkey: ''
    close_tab_after: false
    find_first: false
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Congratulated the student on passing Task 1.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Nice work on Task 1, {{first_name}}!
      body_html_file: sample_task1_passed.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false
    batch:
      filters:
      - column: Course Code
        op: is
        value: YOUR_COURSE
      preview: true

  # BATCH (note + email + text): TRIAGE — check in with students who are losing
  # momentum. Filters on the caseload's Momentum signal (Low / Med Low), so it
  # targets exactly who needs a nudge, not everyone. Edit YOUR_COURSE. Preview
  # is ON — review the recipient list before anything sends.
  Sample - low-momentum check-in (batch):
    hotkey: ''
    close_tab_after: false
    find_first: false
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Checked in with a low-momentum student to re-engage them.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Checking in on {{course_code}}, {{first_name}}
      body_html_file: sample_momentum_checkin.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false
    text:
      body: Hi {{first_name}}, it's {{user_name}} from {{course_code}}. Just checking
        in - how are things going? Reply any time, I'm happy to help you get moving.
      body_file: ''
      schedule: true
      window_start_hour: 10
      window_end_hour: 16
      inbox_label: ''
      commit: false
    batch:
      filters:
      - column: Course Code
        op: is
        value: YOUR_COURSE
      - column: Momentum
        op: is any of
        value: Low, Med Low
      preview: true

  # BATCH (note + email): TRIAGE — reach the students whose Follow-up Date has
  # arrived. Filters Follow-up Date "is on or before today" (the special value
  # `today` resolves at fire time), so it catches everyone you flagged for a
  # check-in that's now due. Preview is ON.
  Sample - follow-up due (batch):
    hotkey: ''
    close_tab_after: false
    find_first: false
    notes:
    - interaction_format: Single Interaction
      interaction_type: Email to Student
      body: Sent a scheduled follow-up to the student.
      academic_activities: []
      submit: true
      append_clipboard: false
      enter_additional_text: false
    email:
      subject: Following up, {{first_name}}
      body_html_file: sample_followup_due.html
      to: ''
      signature_file: ''
      inline_images: []
      cc_pm: false
    batch:
      filters:
      - column: Followup Date
        op: is on or before
        value: today
      preview: true

  # PANEL (text + note): pick a student in the viewer, then fire this to send a
  # quick Mongoose text AND log a note - no email, no batch. A low-stakes way to
  # try texting. Text scheduling is ON (sends within the 10am-4pm window in the
  # student's timezone); set schedule to false to send immediately. The note is
  # typed "Instant Message (IM) / Text" and left with submit OFF, so it fills the
  # note form for you to add any Academic Activity and submit yourself - flip
  # submit to true once you've got the note the way you want it.
  Sample - quick text:
    hotkey: ''
    close_tab_after: false
    find_first: false
    panel_action: true
    notes:
    - interaction_format: Single Interaction
      interaction_type: Instant Message (IM) / Text
      body: Sent a quick text to the student.
      academic_activities: []
      submit: false
      append_clipboard: false
      enter_additional_text: false
    text:
      body: Hi {{first_name}}, it's {{user_name}}, your {{course_code}} instructor.
        Just reaching out - let me know if there's anything I can help with!
      body_file: ''
      schedule: true
      window_start_hour: 10
      window_end_hour: 16
      inbox_label: ''
      commit: false

groups:
- name: Sample single actions (edit or delete me)
  color: '#2f75c9'
  scenarios:
  - Try me - file a test note
  - Sample - quick note
  - Sample - follow-up email
  - Sample - quick text
- name: Sample batch actions (edit or delete me)
  color: '#2f9e44'
  scenarios:
  - Try me - welcome email (batch)
  - Sample - welcome (batch)
  - Sample - Task 1 passed (batch)
  - Sample - low-momentum check-in (batch)
  - Sample - follow-up due (batch)

# Reusable note templates — fill-in forms you tab through at fire time. Manage
# them in Settings -> Note templates, or bind one to a note as its default
# (note_template:, as "Sample - quick note" does above). Field kinds: text (one
# line), multiline (a box), dropdown (pick-list of choices), date (type / pick a
# date, with choices as quick-picks). Tag with courses: [C123] to have it
# suggested only for those courses (blank = any).
note_templates:
- name: Student note
  interaction_type: Outreach
  fields:
  - label: Purpose
    kind: multiline
  - label: Outcome
    kind: dropdown
    choices:
    - On track
    - Needs follow-up
    - At risk
  - label: Student action items
    kind: multiline
  - label: Next follow-up
    kind: date
    default: N/A
    choices:
    - N/A
    - 1 week
    - 2 weeks
  - label: Summary
    kind: multiline
